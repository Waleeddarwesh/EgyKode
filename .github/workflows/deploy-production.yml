name: Deploy production

# Production is AWS S3 + CloudFront. Pull-request previews are Cloudflare
# Pages, configured in its dashboard — Pages is never in the production path.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
      - "!.github/workflows/deploy-production.yml"
  workflow_dispatch:

# Never two deploys writing the same bucket at once. A newer push supersedes
# an in-flight one rather than racing it.
concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required to request the OIDC token

env:
  AWS_REGION: us-east-1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same gates that run locally. Production is not the place to find
      # out that a code fence lost its language or a topic lost its chapter.
      - run: npm run lint:mdx
      - run: npm run content:lint
      - run: npm run lint:rtl
      - run: npm run check:translation
      # The edge function is the site's only router — `output: export` removes
      # middleware, so every locale redirect, legacy URL and directory-index
      # rewrite happens there. A mistake in it does not break one page.
      - run: npm run test:edge
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest

    # An `environment: production` block would add a deployment record, a URL
    # on the run, and optional required reviewers. It is commented out because
    # GitHub validates the name against environments that already exist, and
    # referencing one that has not been created shows as an error. Create it
    # under Settings -> Environments, then uncomment:
    #
    # environment:
    #   name: production
    #   url: https://egykode.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          NEXT_OUTPUT: export
          NEXT_DIST_DIR: .next-export
          NEXT_PUBLIC_SITE_URL: https://egykode.com
        run: |
          # Must run here, not only in the root `build` script: this step calls
          # the workspace build directly, so the root script's prerequisites are
          # skipped. Missing it shipped a guard that fetched a 404 and silently
          # did nothing.
          npm run build:id
          npm run tokens
          npm run topics
          npm run search

          # No retry loop here any more. It existed because `next/font/google`
          # fetched four families from fonts.gstatic.com during the build, and
          # a timeout there failed a release with nothing wrong with the commit
          # (e190ce6). The families are now committed under app/fonts and read
          # by next/font/local, so the build makes no outbound request and a
          # failure here means the commit is genuinely broken — retrying it
          # three times would only delay that answer by a minute.
          npm run build --workspace=@egykode/web

      # Between building and publishing, because everything after this writes
      # to the bucket. Run afterwards, it reports a fault that is already live.
      #
      # This catches what a status check cannot: a static export writes a page
      # that called `notFound()` to disk as ordinary HTML, and the CDN serves it
      # 200. Five chapters shipped blank that way and the deploy was green.
      - name: Verify export before publishing
        run: node scripts/check-export.mjs apps/web/.next-export

      # What GitHub will actually present. `Not authorized to perform
      # sts:AssumeRoleWithWebIdentity` never tells you which claim failed, so
      # this prints the subject the trust policy has to match.
      - name: Show OIDC subject
        env:
          RUNNER_DEBUG_SUB: ${{ github.repository }}
        run: |
          echo "repository : ${{ github.repository }}"
          echo "ref        : ${{ github.ref }}"
          echo "event      : ${{ github.event_name }}"
          echo "expected sub: repo:${{ github.repository }}:ref:${{ github.ref }}"

      # Short-lived credentials from the OIDC token. No AWS key is stored in
      # this repository, which is the property the Jenkins chapter claims.
      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: egykode-deploy-${{ github.run_id }}

      # Two passes, because the two kinds of file want opposite cache headers.
      # Fingerprinted assets first: they are immutable, and uploading them
      # before the HTML that references them avoids a window where a page
      # points at an asset that is not there yet.
      - name: Upload immutable assets
        run: |
          aws s3 sync apps/web/.next-export/_next/static \
            s3://${{ secrets.AWS_SITE_BUCKET }}/_next/static \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Upload pages
        run: |
          aws s3 sync apps/web/.next-export \
            s3://${{ secrets.AWS_SITE_BUCKET }} \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete \
            --only-show-errors

      # Only the mutable half needs invalidating. `/_next/static/*` is
      # content-hashed, so invalidating it would be free churn — and the first
      # 1,000 invalidation paths a month are free, which this stays inside.
      - name: Invalidate pages
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Smoke test
        run: |
          for path in / /en/ /en/learn/ /en/topics/ /en/roadmaps/ /en/courses/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://egykode.com$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

          # The stale-tab guard fetches this and stays silent if it 404s, so a
          # missing file ships a feature that does nothing and says nothing.
          # That is exactly what happened once: the guard was live for a deploy
          # while this file was absent. Assert the content, not just the status.
          deployed=$(curl -sf "https://egykode.com/build-id.txt" || echo "MISSING")
          echo "build-id.txt -> $deployed"
          [ "$deployed" = "${GITHUB_SHA:0:40}" ] || {
            echo "::error::build-id.txt is '$deployed', expected '${GITHUB_SHA:0:40}'"
            exit 1
          }
