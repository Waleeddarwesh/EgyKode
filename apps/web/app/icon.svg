  <!--
    Browser-tab icon. A solid brand tile with the mark knocked out, rather than
    the bare mark: the mark's strokes are thin, and at 16px on a busy tab strip
    a thin outline dissolves into the background. A filled tile keeps the
    silhouette legible, and works on light and dark browser chrome alike.
  -->
