# Incident 01 — 502 Bad Gateway
#
# Apply this into a cluster that has an ingress controller, then work the
# failure. Do not read this file before attempting the lab: the fault is
# visible here in about four seconds, and finding it in a running cluster is
# the entire exercise.
#
#   kubectl create namespace incident-01
#   kubectl apply -n incident-01 -f incident-01.yaml
#
# Requires: an NGINX ingress controller. On kind:
#   kind create cluster --config kind-ingress.yaml
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:8080"
            - "-text=incident-01 backend is healthy"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: incident-01.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
