# Incident 02 — CrashLoopBackOff
#
# The container starts, dies, and restarts forever. `kubectl logs` shows
# nothing useful, because by the time you run it the kubelet has already
# started a replacement.
#
#   kubectl create namespace incident-02
#   kubectl apply -n incident-02 -f incident-02.yaml
#
# Requires: any cluster. No ingress controller, no cloud account.
#
# Do not read past the metadata before attempting the lab.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  LOG_LEVEL: "info"
  # Note what is *not* here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          envFrom:
            - configMapRef:
                name: api-config
          command:
            - sh
            - -c
            - |
              # A realistic startup check: refuse to run half-configured
              # rather than fail mysteriously later under load.
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set — refusing to start" >&2
                exit 1
              fi
              echo "connected to $DATABASE_URL"
              sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
